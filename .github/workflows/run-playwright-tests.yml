name: Run Playwright Tests

on:
  pull_request:
    branches:
      - draft
  push:
    branches:
      - draft
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite to run
        required: true
        type: choice
        options:
          - smoke
          - regression
          - accessibility
          - visual
          - all
        default: regression
concurrency:
  group: automationexercise-public-demo
  cancel-in-progress: false

jobs:
  playwright:
    name: Playwright tests
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CI: true
      HEADLESS: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Run smoke tests
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'smoke' || inputs.suite == 'all'))
        run: npm run test:smoke

      - name: Run regression tests
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'regression' || inputs.suite == 'all'))
        run: npm run test:regression

      - name: Run accessibility tests
        if: github.event_name == 'workflow_dispatch' && (inputs.suite == 'accessibility' || inputs.suite == 'all')
        run: npm run test:a11y

      - name: Run visual regression tests
        if: github.event_name == 'workflow_dispatch' && (inputs.suite == 'visual' || inputs.suite == 'all')
        run: npm run test:visual

      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/**
          if-no-files-found: warn
          retention-days: 14
