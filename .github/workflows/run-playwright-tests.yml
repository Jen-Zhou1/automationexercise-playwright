name: Run Playwright Tests

# There are only three trigger types, and a schedule is intentionally omitted:
#   pull_request → smoke (2 tests)
#   push → regression (18 tests; the 2 smoke tests are excluded with --grep-invert,
#                       so the two paths do not overlap)
#   Manual → choose smoke / regression / accessibility / visual / visual-update / all
#            all = smoke + regression + a11y + visual, for complete coverage
#            visual-update regenerates baselines and publishes them as an artifact
#            Suites run independently: a failed suite does not skip later suites.
# Scheduled checks against the public demo site would only accumulate server-side data
# and create noisy failures. Design them separately if needed.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite to run (visual-update regenerates baseline snapshots)
        required: true
        type: choice
        options:
          - smoke
          - regression
          - accessibility
          - visual
          - visual-update
          - all
        default: regression
# Runs on the same branch are serialized to prevent conflicts; different branches do not block each other.
# Note: The public demo site is sensitive to concurrency. If occasional failures occur because
# runs on different branches interfere with each other, change group back to the fixed value
# `automationexercise-public-demo` to queue all runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  playwright:
    name: Playwright tests
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CI: true
      HEADLESS: true
      AE_RETRIES: '0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        id: install-dependencies
        run: npm ci

      - name: Type check
        id: type-check
        # Run this before installing browsers: compilation errors surface in about 20 seconds,
        # rather than waiting for browser installation and failing partway through the workflow.
        run: npm run typecheck

      - name: Install Playwright browser
        id: install-playwright-browser
        # One command is sufficient: `install chromium` also installs ffmpeg automatically
        # (Playwright 1.64's resolveBrowsers adds ffmpeg for any target with a browserName),
        # so a separate `install ffmpeg` command is redundant.
        run: npx playwright install chromium

      # The test steps bypass the default success() condition so a failure in one suite does
      # not skip the others. Setup must still succeed, and cancellation still stops later suites.
      # The two paths complement each other without overlap: smoke runs 2 fast tests, while
      # regression excludes those already-run tests with --grep-invert (18 tests). Therefore,
      # suite=all must run **both** for complete functional coverage (2 + 18 = all 20 tagged tests).
      - name: Run smoke tests
        if: ${{ !cancelled() && steps.install-playwright-browser.outcome == 'success' && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'smoke' || inputs.suite == 'all'))) }}
        run: npm run test:smoke

      - name: Run regression tests
        if: ${{ !cancelled() && steps.install-playwright-browser.outcome == 'success' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'regression' || inputs.suite == 'all'))) }}
        run: npm run test:regression

      - name: Run accessibility tests
        if: ${{ !cancelled() && steps.install-playwright-browser.outcome == 'success' && github.event_name == 'workflow_dispatch' && (inputs.suite == 'accessibility' || inputs.suite == 'all') }}
        run: npm run test:a11y

      - name: Run visual regression tests
        if: ${{ !cancelled() && steps.install-playwright-browser.outcome == 'success' && github.event_name == 'workflow_dispatch' && (inputs.suite == 'visual' || inputs.suite == 'all') }}
        run: npm run test:visual

      - name: Update visual baselines
        id: update-visual-baselines
        if: ${{ !cancelled() && steps.install-playwright-browser.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.suite == 'visual-update' }}
        run: npm run test:visual:update

      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/**
          if-no-files-found: warn
          retention-days: 10

      - name: Upload updated visual baselines
        if: ${{ always() && steps.update-visual-baselines.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/08-visual.spec.ts-snapshots/
          if-no-files-found: error
          retention-days: 10
